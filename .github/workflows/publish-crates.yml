name: Publish crates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Resolve publish order without uploading to crates.io
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # GitHub rejects `secrets` inside a step `if`, so the presence check
      # reads the token from the environment.
      - name: Require crates.io API token
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. Create a crates.io API token and add it as a repository secret. Trusted publishing cannot create the new -fork crate names."
            exit 1
          fi

      # The token is passed as a step input. GitHub rejects `secrets` inside
      # a step `if` condition, which made the previous workflow file invalid.
      # This token creates the new -fork crate names. Trusted publishing cannot
      # create a crate name that does not exist yet.
      - name: Publish workspace crates
        uses: katyo/publish-crates@v2
        with:
          # Tag checkouts are detached, and this action cannot date-check a
          # detached HEAD. Version bumps still gate what gets uploaded.
          check-repo: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
