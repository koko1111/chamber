[package]
name = "chamber-tui-fork"
version = "0.5.4"
edition = "2024"
rust-version = "1.88"
authors = ["Mikko Leppänen <mleppan23@gmail.com>"]
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "A secure, local-first secrets manager with encrypted storage and zero-knowledge architecture"
keywords = ["password", "manager", "vault", "secrets", "security"]
categories = ["command-line-utilities", "cryptography"]
readme = "../../README.md"


[dependencies]
chamber-secret-manager-cli-fork = { workspace = true }
chamber-ui-fork = { workspace = true }
chamber-vault-fork = { workspace = true }
crossterm = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
mimalloc = "0.1"

[target.'cfg(not(windows))'.dependencies]
jemallocator = "0.5"

[[bin]]
name = "chamber"
path = "src/main.rs"
